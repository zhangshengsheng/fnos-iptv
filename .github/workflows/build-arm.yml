
name: Build and Release fnOS IPTV ARM

on:
  workflow_dispatch:

  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fnos-iptv-arm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-arm:
    name: Build ARM FPK
    runs-on: ubuntu-22.04

    env:
      FNPACK_VERSION: "1.2.3"

    steps:
      # 1. 获取源码
      - name: Checkout source
        uses: actions/checkout@v5

      # 2. 检查仓库真实文件
      - name: Check source files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          ls -la

          test -f manifest
          test -d app
          test -d app/ui
          test -d cmd
          test -d config
          test -f app.tgz
          test -f ICON.PNG

          grep -q 'appname="fnnas.iptv"' manifest

          VERSION=$(sed -n \
            's/^version="\([^"]*\)".*/\1/p' manifest | head -n 1)

          test -n "$VERSION"

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "=== Check app.tgz ==="
          tar -tzf app.tgz >/dev/null

          echo "=== Check configuration ==="
          test -f config/privilege
          test -f config/resource

          echo "Source checks passed. Version: $VERSION"

      # 3. 下载 fnpack
      - name: Download fnpack
        shell: bash
        run: |
          set -euo pipefail

          URL="https://static2.fnnas.com/fnpack/fnpack-${FNPACK_VERSION}-linux-amd64"

          curl --fail --location --silent --show-error \
            "$URL" \
            --output "$RUNNER_TEMP/fnpack"

          chmod 755 "$RUNNER_TEMP/fnpack"

          "$RUNNER_TEMP/fnpack" --help

          echo "FNPACK=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"

      # 4. 准备临时 ARM 构建目录
      - name: Prepare ARM package directory
        shell: bash
        run: |
          set -euo pipefail

          STAGE="$RUNNER_TEMP/fnos-iptv-arm"
          mkdir -p "$STAGE"

          # 复制当前提交中的跟踪文件，不修改仓库原文件
          git archive HEAD | tar -x -C "$STAGE"

          # 检查并统一应用图标文件名
          if [ ! -f "$STAGE/ICON_256.PNG" ]; then
            if [ -f "$STAGE/icon_256.png" ]; then
              cp "$STAGE/icon_256.png" \
                "$STAGE/ICON_256.PNG"
            else
              echo "::error::Missing 256px application icon"
              exit 1
            fi
          fi

          # 确保 wizard 目录存在
          mkdir -p "$STAGE/wizard"

          # 仅修改临时目录里的 manifest
          if grep -q '^platform="all"$' "$STAGE/manifest"; then
            sed -i \
              's/^platform="all"$/platform="arm"/' \
              "$STAGE/manifest"
          elif grep -q '^platform="arm"$' "$STAGE/manifest"; then
            echo "Manifest already targets ARM."
          else
            echo "::error::Unexpected platform field in manifest"
            grep -n 'platform' "$STAGE/manifest" || true
            exit 1
          fi

          grep -q '^platform="arm"$' "$STAGE/manifest"

          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

          echo "=== Staged manifest ==="
          cat "$STAGE/manifest"

      # 5. 打包 FPK
      - name: Build FPK
        shell: bash
        run: |
          set -euo pipefail

          cd "$STAGE"

          "$FNPACK" build

          mkdir -p "$GITHUB_WORKSPACE/dist"

          shopt -s nullglob
          PACKAGES=("$STAGE"/*.fpk)

          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "::error::No FPK package was generated"
            find "$STAGE" -maxdepth 3 -type f -print
            exit 1
          fi

          if [ "${#PACKAGES[@]}" -gt 1 ]; then
            echo "::error::Multiple FPK files found; refusing ambiguous output"
            printf '%s\n' "${PACKAGES[@]}"
            exit 1
          fi

          cp "${PACKAGES[0]}" \
            "$GITHUB_WORKSPACE/dist/fnos-iptv-${APP_VERSION}-arm64.fpk"

          test -s \
            "$GITHUB_WORKSPACE/dist/fnos-iptv-${APP_VERSION}-arm64.fpk"

      # 6. 校验产物并生成 SHA-256
      - name: Verify package and generate checksum
        shell: bash
        run: |
          set -euo pipefail

          FPK="dist/fnos-iptv-${APP_VERSION}-arm64.fpk"

          test -s "$FPK"

          sha256sum "$FPK" | tee "$FPK.sha256"

          echo "=== Final artifacts ==="
          ls -lh dist/
          cat "$FPK.sha256"

      # 7. 上传 Actions 构建产物
      - name: Upload ARM package artifact
        uses: actions/upload-artifact@v6
        with:
          name: fnos-iptv-arm64
          path: |
            dist/*.fpk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      # 8. 仅在推送 v* 标签时发布 GitHub Release
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: "fnOS IPTV ARM ${{ github.ref_name }}"
          body: |
            ## fnOS IPTV ARM 安装包

            - 版本：${{ github.ref_name }}
            - 平台声明：ARM
            - 安装文件：`.fpk`
            - 校验文件：`.sha256`

            请在目标飞牛 ARM 设备上验证安装、启动及 IPTV 播放功能后再用于生产环境。
          files: |
            dist/*.fpk
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
